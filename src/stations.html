<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/stations.css">
  <script src="./js/stations.js" defer></script>
  <title>Suas estações</title>
</head>

<body>
<nav aria-label="Navegação principal">
  <ul>
    <li><a href="index.html">Início</a></li>
    <li><a href="stations.html" aria-current="page">Suas estações</a></li>
    <li><a href="sobre.html">Sobre</a></li>
  </ul>
</nav>

<main>
  <section id="first" aria-labelledby="page-title">
    <h1 id="page-title">Monitore suas estações em tempo real</h1>

    <button id="btnAddStation" type="button">+ Adicionar estação</button>

    <div class="tableContainer">
      <table class="stationsManager">
        <caption class="sr-only">Dados atuais das estações meteorológicas</caption>
        <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">ID</th>
          <th scope="col">Temperatura</th>
          <th scope="col">Umidade</th>
          <th scope="col">Pressão</th>
          <th scope="col">CO₂</th>
          <th scope="col">TVOC</th>
          <th scope="col">Luminosidade</th>
          <th scope="col">Índice UV</th>
          <th scope="col">Chuva</th>
          <th scope="col">Velocidade do vento</th>
          <th scope="col">Direção do vento</th>
          <th scope="col">Data/hora</th>
        </tr>
        </thead>

        <tbody>
        <!-- As linhas são criadas pelo stations.js. -->
        </tbody>
      </table>
    </div>
  </section>
</main>

<div id="addStationModal" class="addModal" hidden>
  <form id="addStationForm" class="addModalBox" aria-labelledby="addStationTitle">
    <h2 id="addStationTitle">Nova estação</h2>
    <label>ID da estação
      <input id="newStationId" required>
    </label>
    <label>Nome
      <input id="newStationName" required>
    </label>
    <div class="addModalActions">
      <button type="submit">Salvar</button>
      <button type="button" id="cancelAddStation">Cancelar</button>
    </div>
  </form>
</div>

<style>
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ===== Botão Adicionar estação ===== */
  #btnAddStation {
    margin: 16px 0;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background-color: rgb(112, 204, 194);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  #btnAddStation:hover,
  #btnAddStation:focus-visible {
    transform: translateY(-2px);
    filter: brightness(1.08);
    outline: none;
  }

  /* ===== Popup de cadastro ===== */
  .addModal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
  }

  .addModal[hidden] {
    display: none;
  }

  .addModalBox {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(400px, calc(100% - 32px));
    padding: 20px;
    background: #fff;
    border-radius: 10px;
  }

  .addModalBox h2 {
    margin: 0;
  }

  .addModalBox label {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .addModalBox input {
    padding: 8px;
    font: inherit;
  }

  .addModalActions {
    display: flex;
    gap: 10px;
  }

  .addModalActions button {
    padding: 8px 14px;
    font: inherit;
    border-radius: 5px;
    cursor: pointer;
  }

  .addModalActions button[type="submit"] {
    color: #fff;
    background-color: rgb(112, 204, 194);
    border: 0;
  }

  .addModalActions button[type="button"] {
    color: #333;
    background-color: #fff;
    border: 1px solid #999;
  }
</style>

<script>
  (function () {
    const API_SERVIDOR = "http://localhost:8080";   // se abrir de outro computador, use o IP do servidor
    const userId = localStorage.getItem("userId") || "1";   // ajuste para como sua página obtém o userId

    const modal = document.getElementById("addStationModal");
    const form = document.getElementById("addStationForm");

    document.getElementById("btnAddStation").addEventListener("click", () => {
      modal.hidden = false;
      document.getElementById("newStationId").focus();
    });

    document.getElementById("cancelAddStation").addEventListener("click", () => {
      modal.hidden = true;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const body = {
        stationId: document.getElementById("newStationId").value.trim(),
        name: document.getElementById("newStationName").value.trim(),
        userId: userId
      };

      try {
        const resp = await fetch(`${API_SERVIDOR}/stations/add`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!resp.ok) throw new Error("Falha ao cadastrar");
        modal.hidden = true;
        form.reset();
      } catch (err) {
        alert("Não foi possível cadastrar a estação. Confira se o servidor está ligado.");
      }
    });
  })();
</script>
</body>
</html>
