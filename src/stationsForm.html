<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
  <title>Crie Sua Estação</title>
  <script src="./js/stationsForm.js" defer></script>
  <style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        background-image: url(../assets/imgs/background.png);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

         display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #4a3f35;
}

/* fundo ficar escuro no body */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.3); /* escurece o fundo */
  z-index: -1;
}

    .form-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 30px;
      box-shadow: 0 12px 30px rgba(112, 85, 86, 0.22);
      padding: 32px;
      width: min(820px, 80vw);
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.8);
      margin-top: 80px;
    }

    .form-card h1 {
      margin: 0 0 18px;
      font-size: 1.9rem;
    }

    .form-card p {
      margin: 0 0 28px;
      color: #738da2;
      line-height: 1.5;
    }

    .field-group {
      display: grid;
      gap: 16px;
      margin-bottom: 24px;
    }

    label {
      text-align: left;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px 0px;
      border-radius: 16px;
      border: 1px solid #1f3ac4;
      background: #bbc4cfa8;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }


    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #1f3ac4;
      box-shadow: 0 0 0 4px rgba(234, 127, 146, 0.14);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .submit-btn {
      background: #1f3ac4;
      border: none;
      color: white;
      font-weight: 700;
      padding: 15px 22px;
      border-radius: 20px;
      cursor: pointer;
    }

    .form-card aside{
      position: relative;
    }

    .form-card aside i{
      position: absolute;
      top: 0;
      right: 10px;
      font-size: 3rem;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <main class="form-card">
    <aside>
      <h1>Crie Sua Estação </h1> <i class='bx bx-x' onclick="returnToStations()"></i>
    </aside>
    <p>Adicione as informações da sua estação meteorológica.</p>
    <form id="station-form">
      <div class="field-group">
        <label for="name">Name</label>
        <input type="text" id="nameInput">
      </div>
      <div class="field-group">
        <label for="latitude">Latitude</label>
        <input type="number" id="latitudeInput">
      </div>
      <div class="field-group">
        <label for="time-stamp">Longitude</label>
        <input type="number" id="longitudeInput" />
      </div>
        <div class="field-group">
            <label for="time-zone">Time Zone (unix)</label>
            <input type="number" id="timeZoneInput" name="time-zone">
      </div>
        
      
      <button type="submit" class="submit-btn">Enviar</button>
    </form>
  </main>
</body>
</html>
