<html lang="en">
<head>

  <title>Criar estação</title>

  <style>
    .stationCard:hover{

      cursor: default;
      height: 500px;
      width: 400px;

    }

    .stationCard p{

      font-size: 1.2em;
    }

      font-weight: 400;
    }
  </style>
</head>

  <nav>
    <ul>

    </ul>
  </nav>

  <main>
    <section id="first">
      <h1>Estação</h1>
   
      
    </section>
    <section id="second">
      <div class="stationCard">
        <p>Latitude: <span class="latitude"></span></p>
        <p>Longitude <span class="longitude"></span></p>
        
      </div>
    </section>
  </main>

</html>
